# http-level maps for the Railway proxy chain (loaded before default.conf).
# Railway terminates TLS at its edge and sends X-Forwarded-Proto itself; nginx's own $scheme is
# always http here, so pass the edge's value on (whitelisted) or fall back to $scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}
# Railway's edge appends its own public address to X-Forwarded-For ("client, edge"). WeKnora (Gin)
# walks the header right to left skipping trusted private proxies, so that edge hop would win.
# Strip the last hop and pass the rest; fall back to the peer address when the header is absent.
map $http_x_forwarded_for $client_xff {
    default                                  $remote_addr;
    "~^(?<chain>.+?)\s*,\s*[^,\s]+\s*$"   $chain;
    "~^\s*(?<single>[^,\s]+)\s*$"          $single;
}
